version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: ispro-postgres
    environment:
      POSTGRES_USER: ispro
      POSTGRES_PASSWORD: ispro
      POSTGRES_DB: ispro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ispro -d ispro"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: